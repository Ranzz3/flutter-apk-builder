<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pterodactyl Panel - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: 
                radial-gradient(ellipse at top, #1a2332 0%, #0d1117 70%),
                radial-gradient(ellipse at bottom, #161b22 0%, #0d1117 70%);
        }
        .login-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 28px;
            color: #58a6ff;
            letter-spacing: 2px;
        }
        .logo p {
            color: #8b949e;
            margin-top: 5px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #c9d1d9;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88,166,255,0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #238636;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #2ea043;
        }
        .btn-secondary {
            background: #30363d;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #444c56;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #8b949e;
            font-size: 13px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #8b949e;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <h1>🦖 PTERODACTYL</h1>
            <p>Game Server Management Panel</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        
        <button onclick="showRegister()" class="btn btn-secondary">Register</button>
        
        <div class="footer">
            Pterodactyl Panel v1.0 • Codespace Edition
        </div>
    </div>

    <!-- Register Box -->
    <div id="registerBox" class="login-box" style="display:none;">
        <div class="logo">
            <h1>🦖 REGISTER</h1>
            <p>Create your account</p>
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" required>
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="regFirstName" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        
        <button onclick="showLogin()" class="btn btn-secondary">Back to Login</button>
    </div>

    <script>
        const API = '/api';
        
        function showRegister() {
            document.querySelector('#loginForm').parentElement.style.display = 'none';
            document.querySelector('#registerBox').style.display = 'block';
        }
        
        function showLogin() {
            document.querySelector('#loginForm').parentElement.style.display = 'block';
            document.querySelector('#registerBox').style.display = 'none';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/panel';
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert('Gagal login: ' + e.message);
            }
        });
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('regUsername').value,
                        firstName: document.getElementById('regFirstName').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('Registrasi berhasil! Silakan login.');
                    showLogin();
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert('Gagal register: ' + e.message);
            }
        });
    </script>
</body>
</html>
